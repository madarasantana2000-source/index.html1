<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Links | Hamburgueria Artesanal</title>
    <style>
        /* Configurações de Cores e Estilo Geral */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        
        body {
       
            margin: 0;
            padding: 0;
            /* Aplica a imagem, centraliza e faz cobrir toda a tela */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url("images/hedercapa.jpg.jpg");
            background-size: cover;
            background-position: center;
            background-position-x: 100%;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .conteudo {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7); /* Caixa escura para destacar o texto */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        
        }
        
        /* Container Principal (Estilo Smartphone / Centralizado) */
        .bio-container { 
            width: 100%; 
            max-width: 550px; 
            text-align: center; 
            background: #1a1a1a; 
            padding: 35px 20px; 
            border-radius: 28px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a2a;
        }
        
        /* Foto/Logo Redonda */
        .avatar-container { 
            width: 100px; 
            height: 100px; 
            margin: 0 auto 15px; 
            border-radius: 50%;
            border: 4px solid #ff9f1c;
            overflow: hidden;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar { width: 100%; height: 100%; object-fit: cover; }
        .avatar-fallback { font-size: 32px; }

        /* Textos de Apresentação */
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: #ffffff; }
        .tagline { font-size: 0.9rem; color: #ff9f1c; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .description { font-size: 0.95rem; line-height: 1.5; color: #b3b3b3; margin-bottom: 30px; }
        
        /* Grupo de Botões */
        .links-group { display: flex; flex-direction: column; gap: 16px; }
        
        /* Botão Padrão */
        .bio-link { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #262626; 
            border: 1px solid #333333; 
            color: #ffffff; 
            padding: 16px 20px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1rem; 
            border-radius: 16px; 
            transition: all 0.25s ease; 
        }
        
        /* Efeito de passar o mouse / tocar */
        .bio-link:hover { 
            background-color: #333333; 
            border-color: #ff9f1c;
            transform: translateY(-3px); 
            box-shadow: 0 8px 24px rgba(255, 159, 28, 0.2); 
        }
        
        /* Botão de Destaque (Peça Agora / WhatsApp) */
        .bio-link.featured { 
            background: linear-gradient(90deg, #ff9f1c 0%, #ff6b6b 100%); 
            border: none; 
            color: #121212; 
            font-weight: 700;
        }
        .bio-link.featured:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.4); 
        }
        
        /* Rodapé */
        footer { margin-top: 40px; font-size: 0.8rem; color: #666666; }
    </style>
</head>
<body>

    <div class="bio-container">
        
        <!-- Identidade Visual da Hamburgueria -->
        <div class="avatar-container">
            <!-- Substitua o '🍔' pela URL do seu logotipo real se preferir, ex: <img src="logo.png" class="avatar"> -->
            <span class="avatar-fallback"><img src="images/rootlogo.capa.pnj.png"- alt="Logotipo" class="avatar"></span>
        </div>
        
        <h1>ROOT BURGUER
        
        </h1>
        <p class="tagline">Burgers Artesanais</p>
        <p class="description">
            O verdadeiro sabor em cada mordida! 👑
        </p>

        <!-- Menu de Links do Biosite -->
        <nav class="links-group">
            
            <!-- LINK DESTAQUE: Pedidos Online -->
            <a href="https://wa.me/5571987995799" target="_blank" class="bio-link featured">
                🚀 Faça seu Pedido pelo WhatsApp
            </a>
            
            <!-- LINK 2: Cardápio Digital -->
            <a href="https://pedido.anota.ai/loja/rootburguercb?referer=gbp_anota" target="_blank" class="bio-link">
                📖 Ver Nosso Cardápio Completo
            </a>
            
            <!-- LINK 3: Localização (O link do Google Maps fornecido) -->
            <a href="https://maps.app.goo.gl/JLjYaLYffPaZNu9N8" target="_blank" class="bio-link">
                📍 Como Chegar / Comer no Local

                
            </a>
            
            <!-- LINK 4: Cupons ou Promoções da Semana -->
            <a href="https://www.instagram.com/rootburguercastelobranco/" target="_blank" class="bio-link">
                🎁 Promoções e Combos da Semana
            </a>
            
            <!-- LINK 5: Avaliação no Google (Ajuda no SEO local) -->
            <a href="https://maps.app.goo.gl/JLjYaLYffPaZNu9N8" target="_blank" class="bio-link">
                ⭐ Deixe sua Avaliação no Google
            </a>
            
        </nav>

        <!-- Rodapé do Site -->
        <footer>
            Abriremos hoje das 17h às 23h00
        </footer>
        
    </div>

</body>
</html>
